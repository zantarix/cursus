name: Add Changeset for Dependency PRs

# Runs on PRs labelled `dependencies` (added automatically by Renovate,
# Dependabot, and similar bots).  Uses `cursus change --auto` to derive
# a changeset from the single Conventional Commit on the branch.
#
# The bot must be configured to emit commits with semver-significant types
# for this to produce a changeset.  For Renovate, set `semanticCommitType`
# in renovate.json:
#
#   "semanticCommitType": "fix"   → patch changeset (regular updates)
#   "semanticCommitType": "feat"  → minor changeset
#
# Commits typed `chore:` (the Renovate default) have no semver significance
# and cursus will exit 0 without writing a changeset.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  changeset:
    name: Add changeset
    if: contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#ci -c bash -e {0}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ vars.ZANTARIX_APP_ID }}
          private-key: ${{ secrets.ZANTARIX_APP_PRIVATE_KEY }}

      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false

      - name: Configure git identity
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ vars.ZANTARIX_APP_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Build cursus
        run: cargo build --release

      # Derive a changeset from the single Renovate commit and push it back
      # to the PR branch.  Cursus exits 0 without writing anything if the
      # commit type carries no semver significance (e.g. `chore:`).
      - name: Add changeset
        run: ./target/release/cursus change --auto
