name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@19effe9fe722874e6d46dd7182e4b8b7a43c4a99 # v31.10.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Pre-build devShell
        run: nix build --no-link .#devShells.$(nix eval --impure --raw --expr 'builtins.currentSystem').default

      - name: Build Nix package
        run: nix build --no-link

      - name: Check formatting
        shell: nix develop -c bash -e {0}
        run: cargo fmt --check

      - name: Lint with Clippy
        shell: nix develop -c bash -e {0}
        run: cargo clippy -- -D warnings

      - name: Check dependencies
        shell: nix develop -c bash -e {0}
        run: cargo deny check

      - name: Run tests
        shell: nix develop -c bash -e {0}
        run: cargo test

      - name: Check code coverage
        shell: nix develop -c bash -e {0}
        run: cargo make coverage

      - name: Check cross-compilation
        shell: nix develop -c bash -e {0}
        run: cargo make release

      - name: Upload linux-x86_64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/chronicle

      - name: Upload linux-aarch64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-aarch64
          path: target/aarch64-unknown-linux-musl/release/chronicle

      - name: Upload linux-riscv64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-riscv64
          path: target/riscv64gc-unknown-linux-musl/release/chronicle

      - name: Upload macos-x86_64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macos-x86_64
          path: target/x86_64-apple-darwin/release/chronicle

      - name: Upload macos-aarch64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macos-aarch64
          path: target/aarch64-apple-darwin/release/chronicle

      - name: Upload windows-x86_64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-x86_64
          path: target/x86_64-pc-windows-gnullvm/release/chronicle.exe

      - name: Upload windows-aarch64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-aarch64
          path: target/aarch64-pc-windows-gnullvm/release/chronicle.exe

  smoke-test:
    name: Smoke test (${{ matrix.artifact }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-x86_64
            binary: chronicle
          - runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            binary: chronicle
          - runner: macos-26-intel
            artifact: macos-x86_64
            binary: chronicle
          - runner: macos-latest
            artifact: macos-aarch64
            binary: chronicle
          - runner: windows-latest
            artifact: windows-x86_64
            binary: chronicle.exe
          - runner: windows-11-arm
            artifact: windows-aarch64
            binary: chronicle.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Make executable
        if: runner.os != 'Windows'
        run: chmod +x ./bin/${{ matrix.binary }}

      - name: Run smoke test
        run: ./bin/${{ matrix.binary }} --version
