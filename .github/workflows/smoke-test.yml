name: Smoke Tests

on:
  schedule:
    - cron: '0 14 * * 5'  # Friday 14:00 UTC = Saturday 00:00 AEST (UTC+10); 01:00 AEDT during summer
  workflow_dispatch:

jobs:
  release:
    name: Release (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: linux-x86_64
            binary: cursus
          - target: aarch64-unknown-linux-musl
            artifact: linux-aarch64
            binary: cursus
          - target: riscv64gc-unknown-linux-musl
            artifact: linux-riscv64
            binary: cursus
            # No GitHub-hosted RISC-V runner exists; artifact is built but not smoke-tested
          - target: x86_64-pc-windows-gnullvm
            artifact: windows-x86_64
            binary: cursus.exe
          - target: aarch64-pc-windows-gnullvm
            artifact: windows-aarch64
            binary: cursus.exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false

      - name: Build ${{ matrix.artifact }}
        shell: nix develop -c bash -e {0}
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  release-macos:
    name: Release (${{ matrix.artifact }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: macos-x86_64
            binary: cursus
          - target: aarch64-apple-darwin
            artifact: macos-aarch64
            binary: cursus
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false

      - name: Build ${{ matrix.artifact }}
        shell: nix develop -c bash -e {0}
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  smoke-test:
    name: Smoke test (${{ matrix.artifact }})
    needs: [release, release-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-x86_64
            binary: cursus
          - runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            binary: cursus
          - runner: macos-26-intel
            artifact: macos-x86_64
            binary: cursus
          - runner: macos-latest
            artifact: macos-aarch64
            binary: cursus
          - runner: windows-latest
            artifact: windows-x86_64
            binary: cursus.exe
          - runner: windows-11-arm
            artifact: windows-aarch64
            binary: cursus.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Make executable
        if: runner.os != 'Windows'
        run: chmod +x ./bin/${{ matrix.binary }}

      - name: Run smoke test
        run: ./bin/${{ matrix.binary }} --version
