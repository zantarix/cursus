name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ZANTARIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.ZANTARIX_APP_PRIVATE_KEY }}

      # Fetch full history so that `cursus ci` can detect existing git tags.
      # The default GITHUB_TOKEN suffices for the read-only clone/fetch; the
      # release commit and tag are created through the GitHub API with the App
      # token, so the git remote is never pushed to.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Install NPM dependencies
        run: npm ci
        working-directory: packages/npm

      - name: Build cursus
        run: cargo build --release

      - name: Exchange OIDC token for crates.io registry token
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Run cursus ci
        env:
          # Override the default GITHUB_TOKEN so cursus uses the App token
          # for all GitHub API calls (PRs, releases).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: ./target/release/cursus ci --no-interactive
