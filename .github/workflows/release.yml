name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.ZANTARIX_APP_ID }}
          private-key: ${{ secrets.ZANTARIX_APP_PRIVATE_KEY }}

      # Fetch full history so that `cursus ci` can detect existing git tags.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Use the GitHub App bot as the git committer so release commits are
      # attributed to the App rather than to a personal account.
      - name: Configure git identity
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ vars.ZANTARIX_APP_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false

      - name: Build cursus
        shell: nix develop .#ci -c bash -e {0}
        run: cargo build --release

      - name: Run cursus ci
        shell: nix develop .#ci -c bash -e {0}
        env:
          # Override the default GITHUB_TOKEN so cursus uses the App token
          # for all GitHub API calls (PRs, releases).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # TODO: Cargo and NPM credentials will be needed eventually.
        run: ./target/release/cursus ci --no-interactive
