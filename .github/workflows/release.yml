name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ vars.ZANTARIX_APP_ID }}
          private-key: ${{ secrets.ZANTARIX_APP_PRIVATE_KEY }}

      # Fetch full history so that `cursus ci` can detect existing git tags.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false

      # Use the GitHub App bot as the git committer so release commits are
      # attributed to the App rather than to a personal account.
      - name: Configure git identity
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ vars.ZANTARIX_APP_USER_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build cursus
        run: cargo build --release

      - name: Exchange OIDC token for crates.io registry token
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Run cursus ci
        env:
          # Override the default GITHUB_TOKEN so cursus uses the App token
          # for all GitHub API calls (PRs, releases).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: ./target/release/cursus ci --no-interactive

