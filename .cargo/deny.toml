# cargo-deny configuration for supply chain security
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow MPL-2.0 (project license) and common permissive licenses
allow = [
	"MPL-2.0",
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"CDLA-Permissive-2.0",
	"Unicode-3.0",
	"Zlib",
	"OpenSSL",
]

# Warn on confidence level
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"

# Skip common crates that often have multiple versions in the ecosystem
skip = []

# Deny specific crates (empty by default)
deny = []

[advisories]
# Ignore specific advisories (add IDs here if needed)
ignore = []

[sources]
# Allow only crates.io
unknown-registry = "deny"
unknown-git = "deny"

# Allow these git sources (empty by default)
allow-git = []
