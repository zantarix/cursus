# cargo-deny configuration for supply chain security
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow MPL-2.0 (project license) and common permissive licenses
allow = [
	"MPL-2.0",
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Unicode-3.0",
	"Zlib",
]

# Warn on confidence level
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "deny"

# Skip crates that often have multiple versions but don't cause issues
skip = [
	"cpufeatures",
	"getrandom",
	"hashbrown",
	"rand",
	"rand_core",
	"r-efi",
	"windows-sys",
	"wit-bindgen",
]

# Deny specific crates (empty by default)
deny = []

[advisories]
# Ignore specific advisories (add IDs here if needed)
ignore = [
	"RUSTSEC-2023-0071",
]

[sources]
# Allow only crates.io
unknown-registry = "deny"
unknown-git = "deny"

# Allow these git sources (empty by default)
allow-git = []
