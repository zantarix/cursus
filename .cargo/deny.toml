# cargo-deny configuration for supply chain security
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow MPL-2.0 (project license) and common permissive licenses
allow = [
	"MPL-2.0",
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Unicode-3.0",
	"Zlib",
	# CDLA-Permissive-2.0 is a Linux Foundation data license used by `webpki-root-certs`
	# (Mozilla's CA bundle) reached transitively via the `gitlab` crate → reqwest → rustls.
	# Applies to certificate data, not code.
	"CDLA-Permissive-2.0",
]

# Warn on confidence level
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "deny"

# Skip crates that often have multiple versions but don't cause issues
skip = [
	"cpufeatures",
	"getrandom",
	"hashbrown",
	"rand",
	"rand_core",
	"r-efi",
	"windows-sys",
	"wit-bindgen",
	# Duplicates pulled in transitively by the `gitlab` crate (cron 0.15, derive_builder,
	# graphql_client, etc.) until upstream catches up. These crates also appear via toml /
	# clap / proc-macro frameworks in newer versions; neither version is directly used by
	# cursus.
	"darling",
	"darling_core",
	"darling_macro",
	"heck",
	"syn",
	"thiserror",
	"thiserror-impl",
	"winnow",
]

# Deny specific crates (empty by default)
deny = []

[advisories]
# Ignore specific advisories (add IDs here if needed)
ignore = [
	"RUSTSEC-2023-0071",
]

[sources]
# Allow only crates.io
unknown-registry = "deny"
unknown-git = "deny"

# Allow these git sources (empty by default)
allow-git = []
