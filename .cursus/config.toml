# [global]
# disable_dependency_cycle_warnings = false  # Suppress circular dependency warnings

[cargo]
enabled = true
# path = "subdir/"              # Subdirectory for Cargo.toml (relative to git root)

[npm]
enabled = true
path = "pkg/"
# lock_command = "npm install"  # Custom command to update the lock file
access = "public"               # Access level for scoped packages: "public" or "restricted" (default: "restricted")

# [prepare]
# dependency_bump = "auto"      # Bump level for dependents: "auto" (default), "match", "patch", "minor", or "major"

[linked-versions]
# Keep all packages at the same version (global linking).
enabled = true

# Or define groups of packages that should share a version:
# [[linked-versions.groups]]
# packages = ["@org/prefix-*", "@org/other"]

[git]
enabled = true
strategy = "branch"
# tag_format = "auto"                        # Tag format: "auto", "prefixed", or "simple"
# release_branch_prefix = "cursus-release/"  # Prefix for release branches (branch strategy)
# extra_files = []                           # Additional files to stage before committing

[github]
enabled = true
# owner = "zantarix"
# repo = "cursus"
build_command = "cargo make release"
# pull_request_title = ""           # Custom PR title (default: "Release updates")

[github.artifacts]
# Map of display name -> file path for release assets
cursus-linux-x86_64        = "target/x86_64-unknown-linux-musl/release/cursus"
cursus-linux-aarch64       = "target/aarch64-unknown-linux-musl/release/cursus"
cursus-linux-riscv64gc     = "target/riscv64gc-unknown-linux-musl/release/cursus"
cursus-osx-x86_64          = "target/x86_64-apple-darwin/release/cursus"
cursus-osx-aarch64         = "target/aarch64-apple-darwin/release/cursus"
cursus-windows-x86_64.exe  = "target/x86_64-pc-windows-gnullvm/release/cursus.exe"
cursus-windows-aarch64.exe = "target/aarch64-pc-windows-gnullvm/release/cursus.exe"
