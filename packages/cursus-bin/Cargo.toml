[package]
name = "cursus-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Release management CLI for polyglot projects"
documentation = "https://zantarix.github.io/cursus/"
homepage = "https://zantarix.github.io/cursus/"
repository = "https://github.com/zantarix/cursus"
readme = "../../README.md"

[[bin]]
name = "cursus"
path = "src/main.rs"

[dependencies]
cursus = { path = "../cursus", version = "=0.5.0" }
anyhow = "=1.0.102"
clap = { version = "=4.6.1", features = ["derive"] }
log = "=0.4.29"
mutants = "=0.0.4"
octocrab = "=0.49.9"
sys-locale = "=0.3.2"
tokio = { version = "=1.52.1", default-features = false, features = ["rt-multi-thread", "macros"] }

[features]
default = ["nix-tests"]
nix-tests = []
# Exists so `cargo mutants --features test-support` does not error on this crate.
test-support = []

[dev-dependencies]
cursus = { path = "../cursus", version = "=0.5.0", features = ["test-support"], default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
