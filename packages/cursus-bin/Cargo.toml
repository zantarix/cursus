[package]
name = "cursus-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cursus"
path = "src/main.rs"

[dependencies]
cursus = { path = "../cursus" }
anyhow.workspace = true
clap.workspace = true
log.workspace = true
mutants.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
default = ["nix-tests"]
nix-tests = []
# Exists so `cargo mutants --features test-support` does not error on this crate.
test-support = []

[dev-dependencies]
cursus = { path = "../cursus", features = ["test-support"], default-features = false }
httpmock = "=0.8.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
insta = "=1.46.3"
jsonschema = "=0.45.0"
proptest = "=1.10.0"
serde_json.workspace = true
tempfile = "=3.27.0"
toml.workspace = true

[build-dependencies]
# Pinned separately from workspace (no `json` feature needed for build script).
ureq = { version = "=3.2.0" }

[lints]
workspace = true
