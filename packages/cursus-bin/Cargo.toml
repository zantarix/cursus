[package]
name = "cursus-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cursus"
path = "src/main.rs"

[dependencies]
cursus = { path = "../cursus" }
anyhow = "=1.0.102"
clap = { version = "=4.6.0", features = ["derive"] }
log = "=0.4.29"
mutants = "=0.0.4"
octocrab = "=0.49.6"
sys-locale = "=0.3.2"
tokio = { version = "=1.50.0", default-features = false, features = ["rt-multi-thread", "macros"] }

[features]
default = ["nix-tests"]
nix-tests = []
# Exists so `cargo mutants --features test-support` does not error on this crate.
test-support = []

[dev-dependencies]
cursus = { path = "../cursus", features = ["test-support"], default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
