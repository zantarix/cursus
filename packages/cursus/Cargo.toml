[package]
name = "cursus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
fluent-templates = "0.13.3"
glob = "0.3.3"
jsonc-parser = { version = "0.32.1", features = ["cst"] }
log = "0.4.29"
mutants = "0.0.4"
octocrab = "0.49.6"
petname = { version = "3.0.0", default-features = false, features = ["default-rng", "default-words"] }
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.0"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.23"
shell-escape = "0.1.5"
sys-locale = "0.3.2"
chrono = { version = "0.4.44", default-features = false, features = ["now"] }
toml = "1.0.6"
tokio = { version = "1.50.0", default-features = false, features = ["process", "rt", "fs"] }
toml_edit = "0.25.4"
unic-langid = "0.9.6"

[features]
test-support = []

[dev-dependencies]
cursus = { path = ".", features = ["test-support"], default-features = false }
httpmock = "=0.8.3"
insta = "=1.47.2"
tempfile = "=3.27.0"
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
