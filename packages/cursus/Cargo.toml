[package]
name = "cursus"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Library crate for the cursus release management CLI"
documentation = "https://zantarix.github.io/cursus/"
homepage = "https://zantarix.github.io/cursus/"
repository = "https://github.com/zantarix/cursus"
readme = "../../README.md"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
fluent-templates = "0.14.0"
gitlab = "~0.1811"
glob = "0.3.3"
jsonc-parser = { version = "0.32.1", features = ["cst"] }
log = "0.4.29"
mutants = "0.0.4"
# Use aws-lc-rs as the rustls crypto provider so we share the one pulled in transitively
# by the `gitlab` crate (via reqwest). Without this, both `ring` (octocrab default) and
# `aws-lc-rs` (gitlab) are linked, and rustls 0.23 refuses to auto-select between them
# at runtime ("Could not automatically determine the process-level CryptoProvider").
octocrab = { version = "0.51.0", default-features = false, features = ["follow-redirect", "retry", "rustls", "timeout", "tracing", "default-client", "rustls-aws-lc-rs", "jwt-rust-crypto"] }
percent-encoding = "2.3.2"
petname = { version = "3.0.0", default-features = false, features = ["default-rng", "default-words"] }
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.0"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.26"
shell-escape = "0.1.5"
sys-locale = "0.3.2"
chrono = { version = "0.4.44", default-features = false, features = ["now"] }
toml = "1.0.6"
tokio = { version = "1.52.2", default-features = false, features = ["process", "rt", "fs"] }
toml_edit = "0.25.4"
unic-langid = "0.9.6"

[features]
test-support = []

[dev-dependencies]
cursus = { path = ".", features = ["test-support"], default-features = false }
httpmock = "=0.8.3"
insta = "=1.47.2"
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
