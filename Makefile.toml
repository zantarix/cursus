[config]
default_to_workspace = false

[tasks.coverage]
clear = true
command = "cargo"
args = ["llvm-cov", "--text", "--branch", "--fail-under-lines", "90", "--fail-under-regions", "90", "--fail-under-functions", "90"]
# Note: Branch coverage target is 80%, but cargo-llvm-cov doesn't support --fail-under-branches
# Manually verify branch coverage in the output

[tasks.coverage-html]
clear = true
command = "cargo"
args = ["llvm-cov", "--html", "--branch", "--fail-under-lines", "90", "--fail-under-regions", "90", "--fail-under-functions", "90"]

[tasks.release-x86_64]
command = "cargo"
args = ["build", "--release", "--target", "x86_64-unknown-linux-musl"]

[tasks.release-aarch64]
command = "cargo"
args = ["build", "--release", "--target", "aarch64-unknown-linux-musl"]

[tasks.release-macos]
command = "cargo"
args = ["zigbuild", "--release", "--target", "aarch64-apple-darwin"]

[tasks.release]
dependencies = ["release-x86_64", "release-aarch64", "release-macos"]
