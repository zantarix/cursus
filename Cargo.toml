[workspace]
members = ["packages/cursus", "packages/cursus-bin"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "=1.0.102"
async-trait = "=0.1.89"
clap = { version = "=4.6.0", features = ["derive"] }
crossterm = "=0.29.0"
fluent-templates = "=0.13.3"
glob = "=0.3.3"
jsonc-parser = { version = "=0.29.0", features = ["cst"] }
log = "=0.4.29"
mutants = "=0.0.4"
petname = { version = "=2.0.2", default-features = false, features = ["default-rng", "default-words"] }
ratatui = { version = "=0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "=0.8.0"
semver = "=1.0.27"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde-saphyr = "=0.0.21"
shell-escape = "=0.1.5"
sys-locale = "=0.3.2"
time = { version = "=0.3.47", default-features = false, features = ["std"] }
toml = "=1.0.6"
tokio = { version = "=1.50.0", default-features = false }
toml_edit = "=0.25.4"
unic-langid = "=0.9.6"
ureq = { version = "=3.2.0", features = ["json"] }

[workspace.lints.clippy]
too_many_lines = "warn"
excessive_nesting = "warn"
