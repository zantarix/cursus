[package]
name = "chronicle"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
anyhow = "=1.0.102"
clap = { version = "=4.5.60", features = ["derive"] }
crossterm = "=0.29.0"
glob = "=0.3.3"
serde-saphyr = "=0.0.19"
ratatui = "=0.30.0"
semver = "=1.0.27"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
petname = { version = "=2.0.2", default-features = false, features = ["default-rng", "default-words"] }
toml = "=1.0.1"
toml_edit = "=0.25.3"

[dev-dependencies]
tempfile = "=3.25.0"
