[package]
name = "chronicle"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[dependencies]
anyhow = "=1.0.102"
log = "=0.4.29"
time = { version = "=0.3.47", default-features = false, features = ["std"] }
clap = { version = "=4.5.60", features = ["derive"] }
crossterm = "=0.29.0"
glob = "=0.3.3"
jsonc-parser = { version = "=0.29.0", features = ["cst"] }
mutants = "=0.0.4"
petname = { version = "=2.0.2", default-features = false, features = ["default-rng", "default-words"] }
ratatui = "=0.30.0"
semver = "=1.0.27"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde-saphyr = "=0.0.21"
toml = "=1.0.6"
toml_edit = "=0.25.4"
ureq = { version = "=3.1.4", features = ["json"] }

[features]
test-support = []

[dev-dependencies]
chronicle = { path = ".", features = ["test-support"] }
httpmock = "=0.8.3"
insta = "=1.46.3"
jsonschema = "=0.45.0"
proptest = "=1.10.0"
tempfile = "=3.26.0"

[build-dependencies]
ureq = "=3.1.4"
