[package]
name = "cursus"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[dependencies]
anyhow = "=1.0.102"
log = "=0.4.29"
time = { version = "=0.3.47", default-features = false, features = ["std"] }
clap = { version = "=4.6.0", features = ["derive"] }
crossterm = "=0.29.0"
glob = "=0.3.3"
jsonc-parser = { version = "=0.29.0", features = ["cst"] }
mutants = "=0.0.4"
petname = { version = "=2.0.2", default-features = false, features = ["default-rng", "default-words"] }
ratatui = { version = "=0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "=0.8.0"
semver = "=1.0.27"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde-saphyr = "=0.0.21"
toml = "=1.0.6"
toml_edit = "=0.25.4"
ureq = { version = "=3.2.0", features = ["json"] }
shell-escape = "=0.1.5"
fluent-templates = "=0.13.3"
sys-locale = "=0.3.2"
unic-langid = "=0.9.6"

[features]
default = ["nix-tests"]
nix-tests = []
test-support = []

[dev-dependencies]
cursus = { path = ".", features = ["test-support"], default-features = false }
httpmock = "=0.8.3"
insta = "=1.46.3"
jsonschema = "=0.45.0"
proptest = "=1.10.0"
tempfile = "=3.27.0"

[build-dependencies]
ureq = "=3.2.0"
